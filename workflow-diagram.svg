<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1980 300" font-family="DM Sans, Arial, sans-serif">
  <rect width="1980" height="300" fill="#0d0d0d"/>
  <text x="30" y="40" fill="#3DBF3D" font-family="Syne, Arial, sans-serif" font-size="22" font-weight="700">Booking Confirmation &amp; Reminder Sequence — workflow diagram</text>

  <g font-size="12" fill="#e8e8e8">
    <rect x="30" y="70" width="150" height="55" rx="8" fill="#161616" stroke="#2A9D2A" stroke-width="1.5"/>
    <text x="105" y="93" text-anchor="middle" font-weight="600">Form Trigger</text>
    <text x="105" y="110" text-anchor="middle" font-size="10" fill="#9a9a9a">New Booking Form</text>

    <rect x="210" y="70" width="130" height="55" rx="8" fill="#161616" stroke="#2A9D2A" stroke-width="1.5"/>
    <text x="275" y="93" text-anchor="middle" font-weight="600">Code</text>
    <text x="275" y="110" text-anchor="middle" font-size="10" fill="#9a9a9a">Parse Booking</text>

    <rect x="370" y="70" width="150" height="55" rx="8" fill="#161616" stroke="#2A9D2A" stroke-width="1.5"/>
    <text x="445" y="93" text-anchor="middle" font-weight="600">Send Email</text>
    <text x="445" y="110" text-anchor="middle" font-size="10" fill="#9a9a9a">Confirmation</text>

    <rect x="550" y="70" width="150" height="55" rx="8" fill="#161616" stroke="#2A9D2A" stroke-width="1.5"/>
    <text x="625" y="93" text-anchor="middle" font-weight="600">Google Sheets</text>
    <text x="625" y="110" text-anchor="middle" font-size="10" fill="#9a9a9a">Log (Confirmed)</text>

    <rect x="730" y="70" width="150" height="55" rx="8" fill="#132313" stroke="#3DBF3D" stroke-width="2"/>
    <text x="805" y="93" text-anchor="middle" font-weight="700" fill="#3DBF3D">Wait</text>
    <text x="805" y="110" text-anchor="middle" font-size="10" fill="#9a9a9a">until 24h before</text>

    <rect x="910" y="70" width="150" height="55" rx="8" fill="#161616" stroke="#2A9D2A" stroke-width="1.5"/>
    <text x="985" y="93" text-anchor="middle" font-weight="600">Send Email</text>
    <text x="985" y="110" text-anchor="middle" font-size="10" fill="#9a9a9a">Reminder</text>

    <rect x="1090" y="70" width="150" height="55" rx="8" fill="#132313" stroke="#3DBF3D" stroke-width="2"/>
    <text x="1165" y="93" text-anchor="middle" font-weight="700" fill="#3DBF3D">Wait</text>
    <text x="1165" y="110" text-anchor="middle" font-size="10" fill="#9a9a9a">until 1h after appt.</text>

    <rect x="1270" y="70" width="150" height="55" rx="8" fill="#161616" stroke="#2A9D2A" stroke-width="1.5"/>
    <text x="1345" y="93" text-anchor="middle" font-weight="600">Set</text>
    <text x="1345" y="110" text-anchor="middle" font-size="10" fill="#9a9a9a">Mark No-Show (default)</text>

    <rect x="1450" y="70" width="150" height="55" rx="8" fill="#161616" stroke="#2A9D2A" stroke-width="1.5"/>
    <text x="1525" y="93" text-anchor="middle" font-weight="600">Google Sheets</text>
    <text x="1525" y="110" text-anchor="middle" font-size="10" fill="#9a9a9a">Log (No-Show)</text>

    <rect x="30" y="190" width="220" height="55" rx="8" fill="#161616" stroke="#2A9D2A" stroke-width="1.5"/>
    <text x="140" y="213" text-anchor="middle" font-weight="600">Webhook</text>
    <text x="140" y="230" text-anchor="middle" font-size="10" fill="#9a9a9a">POST /mark-attended (staff/calendar calls this)</text>

    <rect x="290" y="190" width="150" height="55" rx="8" fill="#161616" stroke="#2A9D2A" stroke-width="1.5"/>
    <text x="365" y="213" text-anchor="middle" font-weight="600">Google Sheets</text>
    <text x="365" y="230" text-anchor="middle" font-size="10" fill="#9a9a9a">Log (Attended)</text>
  </g>

  <g stroke="#2A9D2A" stroke-width="1.5" fill="none" marker-end="url(#arrow)">
    <path d="M180,97 L210,97"/>
    <path d="M340,97 L370,97"/>
    <path d="M520,97 L550,97"/>
    <path d="M700,97 L730,97"/>
    <path d="M880,97 L910,97"/>
    <path d="M1060,97 L1090,97"/>
    <path d="M1240,97 L1270,97"/>
    <path d="M1420,97 L1450,97"/>
    <path d="M250,217 L290,217"/>
  </g>

  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#2A9D2A"/>
    </marker>
  </defs>

  <text x="30" y="280" fill="#6a6a6a" font-size="11">Diagram generated from the exported workflow.json — not a live n8n canvas screenshot (browser capture unavailable in this build).</text>
</svg>
